name: New SHOGUN CI

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/new-shogun-ci.yml'
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/new-shogun-ci.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package.json
      - name: Install
        run: npm install
      - name: Check
        run: npm run check
