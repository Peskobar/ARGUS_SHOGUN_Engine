name: ARGUS SHOGUN CI

on:
  pull_request:
    branches: [main, 'ui/**', 'nutrition/**', 'hardening/**']
  push:
    branches: [main, 'ui/**', 'backend/**', 'nutrition/**', 'hardening/**']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: TypeScript
        run: npm run lint

      - name: Backend smoke
        run: npm run smoke:backend

      - name: Nutrition smoke
        run: npm run smoke:nutrition

      - name: Nutrition integrity smoke
        run: npm run smoke:nutrition-integrity

      - name: Unified nutrition workflow smoke
        run: npm run smoke:unified-workflow

      - name: Numeric adversarial smoke
        run: npm run smoke:numeric-adversarial

      - name: Storage poisoning smoke
        run: npm run smoke:storage-poisoning

      - name: Conflict regression smoke
        run: npm run smoke:conflict-regression

      - name: Work audit smoke
        run: npm run smoke:work-audit

      - name: Build
        run: npm run build
