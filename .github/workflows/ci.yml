name: ARGUS SHOGUN CI

on:
  pull_request:
    branches: [main, 'ui/**']
  push:
    branches: [main, 'ui/**', 'backend/**', 'nutrition/**']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: TypeScript
        run: npm run lint

      - name: Backend smoke
        run: npm run smoke:backend

      - name: Nutrition smoke
        run: npm run smoke:nutrition

      - name: Build
        run: npm run build
